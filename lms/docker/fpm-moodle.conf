; Loaded after the image's zz-docker.conf (which sets daemonize=no and listen=9000).
[www]
clear_env = no
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 300
; Answered through nginx at /fpm-ping (127.0.0.1 only): the web container's healthcheck proves nginx AND php-fpm are alive.
ping.path = /fpm-ping
ping.response = pong
