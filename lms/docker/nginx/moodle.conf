# nginx for Moodle 4.5 (no public/ webroot: code lives at /var/www/html). php-fpm is the `moodle` service, reached at moodle:9000.
# Both containers see the code at the same path, so SCRIPT_FILENAME is valid in either.

# Moodle compares the request's host AND port with $CFG->wwwroot and redirects on a mismatch. nginx reports the LISTENING port
# (80 inside the container, while users browse http://localhost:8080): take it from the Host header instead.
map $http_host $moodle_server_port {
    default $server_port;
    "~:(?<hostport>\d+)$" $hostport;
}

# Moodle's web services take their token only as a request parameter (wstoken). The GRC portal's workflow engine can file an
# evidence only from a GET, and a GET with the token in the URL would write it to the access log here and on every proxy in between.
# So the REST endpoint also accepts "Authorization: Bearer <token>": the header value is appended to the arguments handed to php-fpm.
# The logged request line and REQUEST_URI keep the URL exactly as it was sent.
map $http_authorization $ws_bearer {
    default "";
    "~^Bearer\s+(?<bearer>[A-Za-z0-9]{16,128})$" $bearer;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /var/www/html;
    index index.php index.html;

    # php-fpm is addressed through a variable, which makes nginx ask Docker's DNS (127.0.0.11) again every 10 s instead of keeping
    # the address it resolved at start. A recreated php-fpm container can come back with another address; with a literal
    # `fastcgi_pass moodle:9000` nginx then answered 502 until somebody restarted it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fpm moodle:9000;

    # Big uploads (course files, backups restored through the UI); keep in step with upload_max_filesize/post_max_size in moodle.ini.
    client_max_body_size 100M;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;

    # Moodle sets X-Frame-Options itself (allowframembedding); these two are ours, and hidden from PHP so they are never sent twice.
    fastcgi_hide_header X-Content-Type-Options;
    fastcgi_hide_header Referrer-Policy;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health probe (127.0.0.1 only): answered by php-fpm's ping ("pong"), so it fails if either tier is down.
    location = /fpm-ping {
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_pass $fpm;
        access_log off;
    }

    # Nothing here is meant to be fetched over HTTP: dot files, dependencies, tests, CLI scripts, install metadata, docs, config.
    location ~ /\.(?!well-known/) { return 404; }
    location ~* ^/(?:.*/)?(?:vendor|node_modules|tests|behat|fixtures|cli)/ { return 404; }
    location ~* ^/(?:.*/)?(?:db/install\.xml|composer\.(?:json|lock)|package(?:-lock)?\.json|phpunit\.xml(?:\.dist)?|environment\.xml|npm-shrinkwrap\.json|UPGRADING\.md|readme(?:_moodle)?\.(?:txt|md)|upgrade\.txt|CHANGES\.md)$ { return 404; }
    # Lists of bundled library versions and build files: of use only to somebody matching them against known vulnerabilities.
    location ~* ^/(?:.*/)?(?:thirdpartylibs\.xml|Gruntfile\.js|[^/]+\.lock)$ { return 404; }
    location = /config.php { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # REST web services: token from the Authorization header (see the map above). `set` is the one thing `if` is safe for in a location.
    location = /webservice/rest/server.php {
        if ($ws_bearer) { set $args "${args}&wstoken=${ws_bearer}"; }
        include fastcgi_params;
        fastcgi_param SERVER_PORT $moodle_server_port;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_pass $fpm;
    }

    # Slash arguments (/pluginfile.php/<context>/...): the script is split off, the rest becomes PATH_INFO.
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Never hand a non-existent script to php-fpm.
        if (!-f $document_root$fastcgi_script_name) { return 404; }
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SERVER_PORT $moodle_server_port;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
        fastcgi_pass $fpm;
    }
}
